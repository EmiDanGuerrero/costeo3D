# Costeo 3D - E11.2.7: parámetros de referencia acordados.
# EJEMPLO: no reemplaza config/pricing.local.properties.
# Usá la pantalla Configuración de costos para establecerlos en tu instalación.
# Valores eléctricos proporcionados por el usuario y supuestos de vida útil/uso.
electricity.rate.per.kwh=309
printer.average.watts=100
printer.replacement.value=1200000
printer.useful.life.hours=8000
maintenance.annual.cost=300000
printing.hours.per.year=4380

# Recargos SOBRE EL COSTO BASE (no margen neto sobre ventas).
# Normal = x1.80, Llavero = x2.50, Grande = x1.35.
margin.default.percentage=80
margin.llavero.percentage=150
margin.grande.percentage=35
# Mínimo por unidad de llavero para precio calculado, no para modo manual.
price.llavero.minimum=1500
